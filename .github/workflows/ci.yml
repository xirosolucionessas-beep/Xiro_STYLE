name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Typecheck y pruebas
        run: npm run check
      - name: Exportar la app web (verifica que el bundle compila)
        run: npm run build:web
        env:
          CI: '1'
