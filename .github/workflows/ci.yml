name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

# Una sola ejecución por rama: un push nuevo cancela la anterior.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Typecheck, lint, pruebas y build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Typecheck, lint y pruebas (API con PostgreSQL embebido, shared, móvil, página pública)
        run: npm run check
      - name: Exportar la app web (verifica que el bundle compila)
        run: npm run build:web
        env:
          CI: '1'
      - name: Compilar la página pública de reservas
        run: npm run build:public

  audit:
    name: Auditoría de dependencias
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # Lo que corre en el SERVIDOR (API + shared, sin dependencias de desarrollo): cualquier vulnerabilidad alta o
      # crítica rompe el CI.
      - name: Dependencias de producción de la API (bloqueante)
        run: npm audit --omit=dev --workspace @xiro/api --workspace @xiro/shared --audit-level=high
      # Todo el monorepo (incluye herramientas de Expo/Metro): informativo, se revisa en cada actualización del SDK.
      - name: Monorepo completo (informativo)
        run: npm audit --audit-level=critical || echo "::warning::npm audit encontró avisos en herramientas de desarrollo (ver registro)"

  docker:
    name: Imagen Docker (build + arranque real)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Construir la imagen
        run: docker build -t xiro-api:ci .
      - name: Corre como usuario sin privilegios
        run: test "$(docker run --rm --entrypoint id xiro-api:ci -u)" = "1000"
      - name: Arrancar con PostgreSQL y Redis y comprobar que atiende
        run: |
          set -euo pipefail
          docker network create xiro
          docker run -d --name pg --network xiro -e POSTGRES_USER=xiro -e POSTGRES_PASSWORD=xiro -e POSTGRES_DB=xiro postgres:17-alpine
          docker run -d --name redis --network xiro redis:7.4-alpine
          for i in $(seq 1 30); do docker exec pg pg_isready -U xiro -d xiro && break; sleep 1; done
          docker run -d --name api --network xiro -p 3000:3000 --memory 512m \
            -e NODE_ENV=development -e AUTO_MIGRATE=true -e NODE_OPTIONS=--max-old-space-size=384 \
            -e DATABASE_URL=postgres://xiro:xiro@pg:5432/xiro -e REDIS_URL=redis://redis:6379 \
            -e JWT_SECRET=ci-solo-pruebas-ci-solo-pruebas-ci-solo-pruebas \
            xiro-api:ci
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:3000/api/health/ready && break; sleep 1; done
          echo
          curl -fsS http://127.0.0.1:3000/api/health/ready | grep -q '"redis":"up"'
          curl -fsS -X POST http://127.0.0.1:3000/api/auth/register -H 'content-type: application/json' \
            -d '{"name":"CI","businessName":"Negocio CI","email":"ci@correo.com","password":"Secreta123","acceptTerms":true}' | grep -q accessToken
          # El panel web y la página pública vienen dentro de la imagen.
          curl -fsS http://127.0.0.1:3000/ | grep -qi '<html'
          # SIGTERM → cierre ordenado (código 0) dentro del tope.
          docker stop --time 30 api
          test "$(docker inspect -f '{{.State.ExitCode}}' api)" = "0"
      - name: Registro de la API si algo falló
        if: failure()
        run: docker logs api || true

  backup-drill:
    name: Simulacro de respaldo y restauración
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: xiro
          POSTGRES_PASSWORD: xiro
          POSTGRES_DB: xiro
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U xiro -d xiro" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      SOURCE_URL: postgres://xiro:xiro@localhost:5432/xiro
      RESTORE_URL: postgres://xiro:xiro@localhost:5432/xiro_restaurada
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Cliente de PostgreSQL 17 (pg_dump debe ser de la versión del servidor o mayor)
        run: |
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y -qq postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"
      - run: npm ci --workspace @xiro/api --workspace @xiro/shared --include-workspace-root=false
      - name: Base con datos reales (migraciones + datos creados por la API)
        env:
          DATABASE_URL: ${{ env.SOURCE_URL }}
          JWT_SECRET: ci-solo-pruebas-ci-solo-pruebas-ci-solo-pruebas
          AUTO_MIGRATE: 'true'
        run: |
          set -euo pipefail
          npm run start --workspace @xiro/api > api.log 2>&1 &
          api_pid=$!
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:3000/api/health/ready && break; sleep 1; done
          token=$(curl -fsS -X POST http://127.0.0.1:3000/api/auth/register -H 'content-type: application/json' \
            -d '{"name":"Ana","businessName":"Respaldo","email":"respaldo@correo.com","password":"Secreta123","acceptTerms":true}' | node -pe 'JSON.parse(require("fs").readFileSync(0)).accessToken')
          for i in $(seq 1 25); do
            curl -fsS -X POST http://127.0.0.1:3000/api/clients -H "authorization: Bearer $token" -H 'content-type: application/json' -d "{\"name\":\"Cliente $i\",\"phone\":\"30000000$((10 + i))\"}" > /dev/null
          done
          kill "$api_pid"
          sleep 3
      - name: Respaldo cifrado
        env:
          BACKUP_DATABASE_URL: ${{ env.SOURCE_URL }}
          BACKUP_DIR: ./backups
          BACKUP_PASSPHRASE: frase-de-prueba-del-simulacro
        run: bash ops/backup/backup.sh
      - name: Restauración en una base nueva y verificación
        env:
          BACKUP_PASSPHRASE: frase-de-prueba-del-simulacro
        run: |
          set -euo pipefail
          psql "$SOURCE_URL" -c 'create database xiro_restaurada'
          bash ops/backup/restore.sh ./backups/xiro-*.dump.gpg "$RESTORE_URL"
          # Origen y restaurada deben coincidir tabla por tabla (todas las del esquema public y las migraciones).
          query="select string_agg(format('%s=%s', table_name, (xpath('/row/c/text()', query_to_xml(format('select count(*) as c from public.%I', table_name), false, true, '')))[1]::text), ',' order by table_name) from information_schema.tables where table_schema = 'public'"
          source=$(psql "$SOURCE_URL" -Atc "$query"); restored=$(psql "$RESTORE_URL" -Atc "$query")
          echo "origen:      $source"; echo "restaurada:  $restored"
          test "$source" = "$restored"
          test "$(psql "$SOURCE_URL" -Atc 'select count(*) from drizzle.__drizzle_migrations')" = "$(psql "$RESTORE_URL" -Atc 'select count(*) from drizzle.__drizzle_migrations')"
          test "$(psql "$RESTORE_URL" -Atc 'select count(*) from public.clients')" -ge 25
      - name: Registro de la API si algo falló
        if: failure()
        run: cat api.log || true
