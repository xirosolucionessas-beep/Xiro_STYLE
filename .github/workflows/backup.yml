name: Respaldo diario de la base de datos

# Respaldo lógico, cifrado y FUERA del proveedor de la base (Fase 4). Complementa los respaldos automáticos del
# proveedor gestionado. Mientras no existan los secretos, el trabajo termina sin hacer nada (no falla).
#
# Secretos del repositorio (Settings → Secrets and variables → Actions):
#   BACKUP_DATABASE_URL    conexión DIRECTA con un usuario de solo lectura (ver docs/deploy.md)
#   BACKUP_PASSPHRASE      frase larga para cifrar (guárdala también en tu gestor de contraseñas: sin ella no se restaura)
#   BACKUP_S3_URI          p. ej. s3://xiro-backups/postgres
#   BACKUP_S3_ENDPOINT     https://<cuenta>.r2.cloudflarestorage.com
#   BACKUP_S3_ACCESS_KEY_ID / BACKUP_S3_SECRET_ACCESS_KEY   token de R2 con permiso SOLO de escritura en ese bucket
on:
  schedule:
    - cron: '0 8 * * *' # 03:00 en Colombia (UTC-5)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BACKUP_DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
      BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
      BACKUP_S3_URI: ${{ secrets.BACKUP_S3_URI }}
      BACKUP_S3_ENDPOINT: ${{ secrets.BACKUP_S3_ENDPOINT }}
      AWS_ACCESS_KEY_ID: ${{ secrets.BACKUP_S3_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_S3_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      BACKUP_DIR: ./backups
      BACKUP_KEEP: '1'
    steps:
      - name: ¿Está configurado?
        id: configured
        run: |
          if [ -z "$BACKUP_DATABASE_URL" ] || [ -z "$BACKUP_PASSPHRASE" ] || [ -z "$BACKUP_S3_URI" ]; then
            echo "::notice::Respaldo sin configurar (faltan secretos BACKUP_*): no se hace nada."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.configured.outputs.ok == 'true'
      - name: Cliente de PostgreSQL 17
        if: steps.configured.outputs.ok == 'true'
        run: |
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y -qq postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"
      - name: Respaldar, verificar, cifrar y subir
        if: steps.configured.outputs.ok == 'true'
        run: bash ops/backup/backup.sh
