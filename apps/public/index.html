<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" content="#15130f">
  <script>
    (function () {
      try {
        var v = localStorage.getItem('xp-theme');
        var light = v === 'light' || (v !== 'dark' && window.matchMedia('(prefers-color-scheme: light)').matches);
        document.documentElement.setAttribute('data-theme', light ? 'light' : 'dark');
      } catch (e) {}
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=Cormorant+Garamond:wght@500;600;700&display=swap">
  <!--OG_TAGS-->
  <link rel="icon" href="/favicon.png">
</head>
<body>
  <div id="root"><p class="xp-loading">Cargando…</p></div>
  <noscript><p>Activa JavaScript para reservar tu cita.</p></noscript>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
