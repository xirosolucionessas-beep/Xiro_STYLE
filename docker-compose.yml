# Entorno de DESARROLLO con Docker (Fase 4). Producción: ver docs/deploy.md (base de datos y Redis gestionados).
#
#   docker compose up -d                  → PostgreSQL + Redis (la API corre en tu máquina con `npm run dev:api`)
#   docker compose --profile app up -d    → además la API en un contenedor, construida con el Dockerfile de producción
#
# Los puertos solo escuchan en 127.0.0.1: nada queda expuesto a la red local. Credenciales de ejemplo, SOLO desarrollo.
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: xiro
      POSTGRES_PASSWORD: xiro
      POSTGRES_DB: xiro
    ports:
      - '127.0.0.1:54320:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U xiro -d xiro']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    # Límite de memoria con expulsión de las claves que caducan antes (caché y límites de abuso tienen TTL).
    command: ['redis-server', '--maxmemory', '128mb', '--maxmemory-policy', 'volatile-lru', '--save', '']
    ports:
      - '127.0.0.1:63790:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    profiles: ['app']
    build: .
    init: true
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    environment:
      # Variables mínimas para probar la imagen en local. NODE_ENV=development: sin exigir R2, Turnstile ni proveedor de OTP.
      NODE_ENV: development
      DATABASE_URL: postgres://xiro:xiro@postgres:5432/xiro
      REDIS_URL: redis://redis:6379
      JWT_SECRET: solo-desarrollo-cambia-esto-en-produccion-0123456789
      AUTO_MIGRATE: 'true'
      CORS_ORIGINS: http://localhost:8081
      NODE_OPTIONS: --max-old-space-size=384
    ports:
      - '127.0.0.1:3000:3000'
    # Igual que en producción: memoria acotada y el heap de Node explícitamente por debajo del límite (~75 %).
    mem_limit: 512m

volumes:
  pgdata:
